# The validation suite and the benchmarks, every night on the self-hosted Mac mini. Results are
# compared with the previous night's (kept on the runner in ~/bombcad-nightly); the job fails
# when a result changes, a run is much slower than usual or a command fails. See
# docs/continuous-integration.md.
name: Nightly

# Started two ways each evening: by GitHub's schedule, which has run hours late or not at all,
# and at 19:20 UTC by a launch agent on the mini (see docs/continuous-integration.md). A scheduled
# run that finds tonight's already started skips itself.
on:
  schedule:
    # Clear of Scrimply's nightly, which holds the same mini from about 01:30 to 04:30 UTC.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated suite entries to run (blank for all)"
        required: false
        default: ""

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  nightly:
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 480
    steps:
      - name: Skip if tonight's suite has already started
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -v-12H +%Y-%m-%dT%H:%M:%SZ)
          others=$(/opt/homebrew/bin/gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -L 20 \
            --json databaseId,createdAt \
            --jq "[.[] | select(.createdAt >= \"$since\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "Nightly runs started since $since besides this one: $others"
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          persist-credentials: false
      - name: Run the suite
        if: steps.guard.outputs.skip != 'true'
        env:
          ONLY: ${{ inputs.only }}
        run: >
          python3 Scripts/nightly.py
          --history "$HOME/bombcad-nightly"
          --out nightly-results
          --summary "$GITHUB_STEP_SUMMARY"
          ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: nightly-${{ github.run_number }}
          path: nightly-results/

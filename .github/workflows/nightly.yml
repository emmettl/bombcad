# Every night on the self-hosted Mac mini: the full check on main's head, which pushes no longer
# run, reporting what failed and the commits since the last green full check as suspects; then
# the validation suite and the benchmarks. Results are compared with the previous night's (kept
# on the runner in ~/bombcad-nightly); the job fails when a result changes, a run is much slower
# than usual or a command fails. See docs/continuous-integration.md.
name: Nightly

# Started two ways each evening: by GitHub's schedule, which has run hours late or not at all,
# and at 19:20 UTC by a launch agent on the mini (see docs/continuous-integration.md). A scheduled
# run that finds tonight's already started skips itself.
on:
  schedule:
    # Clear of Scrimply's nightly, which holds the same mini from about 01:30 to 04:30 UTC.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated suite entries to run (blank for all)"
        required: false
        default: ""

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  full-check:
    # Not when a run asks for only some suite entries.
    if: github.event_name == 'schedule' || inputs.only == ''
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 120
    steps:
      - name: Skip if tonight's suite has already started
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -v-12H +%Y-%m-%dT%H:%M:%SZ)
          others=$(/opt/homebrew/bin/gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -L 20 \
            --json databaseId,createdAt \
            --jq "[.[] | select(.createdAt >= \"$since\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "Nightly runs started since $since besides this one: $others"
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          # The suspects are named from the history since the last green full check.
          fetch-depth: 0
          persist-credentials: false
      - name: Full check
        id: full
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 100
        shell: bash
        run: |
          set -o pipefail
          log_dir="${{ runner.temp }}/full-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$log_dir"
          { make lint && make ci-test && make build-strict && make test \
            && bash Scripts/build-app.sh release \
            && codesign --verify --deep --strict dist/BombCAD.app; } 2>&1 | tee "$log_dir/full.log"
      - name: Report failures and name suspects
        if: always() && steps.guard.outputs.skip != 'true'
        run: >
          python3 Scripts/nightly-suspects.py
          --outcome "${{ steps.full.outcome }}"
          --log "${{ runner.temp }}/full-${{ github.run_id }}-${{ github.run_attempt }}/full.log"
          --marker "$HOME/bombcad-nightly/last-green-full"
          --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: full-check-${{ github.run_number }}
          path: ${{ runner.temp }}/full-${{ github.run_id }}-${{ github.run_attempt }}/full.log
          if-no-files-found: warn
          retention-days: 14

  nightly:
    # After the full check, whatever its result, on the same runner.
    needs: full-check
    if: always()
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 480
    steps:
      - name: Skip if tonight's suite has already started
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -v-12H +%Y-%m-%dT%H:%M:%SZ)
          others=$(/opt/homebrew/bin/gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -L 20 \
            --json databaseId,createdAt \
            --jq "[.[] | select(.createdAt >= \"$since\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "Nightly runs started since $since besides this one: $others"
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          persist-credentials: false
      - name: Run the suite
        if: steps.guard.outputs.skip != 'true'
        env:
          ONLY: ${{ inputs.only }}
        run: >
          python3 Scripts/nightly.py
          --history "$HOME/bombcad-nightly"
          --out nightly-results
          --summary "$GITHUB_STEP_SUMMARY"
          ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: nightly-${{ github.run_number }}
          path: nightly-results/

  test-impact:
    # Last, whatever came before, on the same runner: the test-impact map of main's head, which
    # check-affected reads to choose a push's tests by coverage (Scripts/test-impact.py). It is
    # kept in ~/bombcad-test-impact here, with its coverage build; the Studio fetches it from there.
    needs: nightly
    if: always() && (github.event_name == 'schedule' || inputs.only == '')
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 300
    steps:
      - name: Skip if tonight's suite has already started
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -v-12H +%Y-%m-%dT%H:%M:%SZ)
          others=$(/opt/homebrew/bin/gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -L 20 \
            --json databaseId,createdAt \
            --jq "[.[] | select(.createdAt >= \"$since\" and .databaseId != $GITHUB_RUN_ID)] | length")
          echo "Nightly runs started since $since besides this one: $others"
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          persist-credentials: false
      - name: Build the map
        if: steps.guard.outputs.skip != 'true'
        run: python3 Scripts/test-impact.py build --out "$HOME/bombcad-test-impact" --jobs 3

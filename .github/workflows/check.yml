# Lint, tests and build on the self-hosted Mac mini, which has the Metal device the solver tests
# need. Only pushes to main and manual runs trigger it: the repository is public, and a
# self-hosted runner must never run code from other people's pull requests.
name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Full application checks, adiabatic benchmark or wall adoption comparison
        type: choice
        options: [all, adiabatic, wall-adoption, packet-adoption, euler-adoption, qr-reconstruction-adoption, qr-coupled-adoption, qr-application-adoption]
        default: all

# Let a run finish: several sessions push to main, often faster than a run takes, and cancelling
# left no run complete. GitHub keeps only the newest waiting push queued behind it.
concurrency:
  # A bounded manual comparison must survive unrelated pushes to main. The
  # physical runner still serializes jobs; ordinary app checks keep their group.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'all' && inputs.suite || 'check' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'adiabatic' && inputs.suite != 'wall-adoption' && inputs.suite != 'packet-adoption' && inputs.suite != 'euler-adoption' && inputs.suite != 'qr-reconstruction-adoption' && inputs.suite != 'qr-coupled-adoption')
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: make lint
      - name: Test release and nightly scripts
        run: make ci-test
      - name: Build
        run: make build
      - name: Test
        # Leave time to upload diagnostics before the overall job timeout.
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          log_dir="${{ runner.temp }}/check-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$log_dir"
          make test 2>&1 | tee "$log_dir/tests.log"
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check-${{ github.run_id }}-${{ github.run_attempt }}/tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify packaged application and signature
        run: |
          bash Scripts/build-app.sh release
          codesign --verify --deep --strict dist/BombCAD.app

  adiabatic:
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source calculation against shared cases
        run: bash Scripts/check-adiabatic.sh "${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Require complete benchmark reports
        run: python3 Scripts/verify-adiabatic-output.py "${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain conformance and complete histories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  wall-adoption:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'wall-adoption'
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-tag application wall and coupled histories
        run: bash Scripts/check-wall-adoption.sh "${{ runner.temp }}/wall-adoption-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete original/shared fields and load intervals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wall-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wall-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  packet-adoption:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'packet-adoption'
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify released packet operator through complete application histories
        run: bash Scripts/check-packet-adoption.sh "${{ runner.temp }}/packet-adoption-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete native remap, moving-reservoir, wall and piston reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packet-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packet-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  euler-adoption:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'euler-adoption'
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete original/shared app Euler and staged histories
        run: bash Scripts/check-euler-adoption.sh "${{ runner.temp }}/euler-adoption-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain full native traces, staged states, fields and wall loads
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: euler-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/euler-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14


  qr-reconstruction-adoption:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'qr-reconstruction-adoption'
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture actual original/shared five-component reconstruction and complete policy references
        run: bash Scripts/check-qr-reconstruction-adoption.sh "${{ runner.temp }}/qr-reconstruction-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain full factors, reused RHS, frame/limiter/backoff/EOS histories and independent controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qr-reconstruction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qr-reconstruction-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  qr-coupled-adoption:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'qr-coupled-adoption'
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture selected complete original/shared production gas study histories
        run: bash Scripts/check-qr-coupled-adoption.sh "${{ runner.temp }}/qr-coupled-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain native stage/state/geometry/load histories and source-bound independent references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qr-coupled-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qr-coupled-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
